<clipPath id="line-1"><rect x="48" y="37" width="500.0" height="30"><animate attributeName="width" values="0;500.0;500.0;0;0" keyTimes="0;0.18;0.29;0.33;1" dur="15s" begin="5s" repeatCount="indefinite"/></rect></clipPath>
