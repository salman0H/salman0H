<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.329;0.333;1" dur="15s" begin="0s" repeatCount="indefinite"/><text x="48" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#38BDF8" clip-path="url(#line-0)">Frontend engineering. Systems thinking.</text></g>
